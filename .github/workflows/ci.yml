name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install OCR and document conversion tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr libreoffice-writer
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check annotator tests
      - name: Tests
        # On Windows, OCR and LibreOffice tests are skipped automatically when the tools are absent.
        run: python -m pytest -q -rs

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End-to-end (browser, API, worker; scripted AI)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ANNOTATOR_ENV: test
      ANNOTATOR_AI_PROVIDER: fake
      ANNOTATOR_DATA_DIR: ${{ github.workspace }}/e2e-data
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Start API, worker and web server
        run: |
          cd backend
          nohup python -m uvicorn annotator.api.app:get_app --factory --port 8000 > ../api.log 2>&1 &
          nohup python -m annotator.worker > ../worker.log 2>&1 &
          cd ../frontend
          nohup npx next start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health > /dev/null && curl -sf localhost:3000 > /dev/null && break; sleep 1; done
      - name: Create a test document
        run: |
          cd backend
          python -c "import sys; sys.path[:0]=['tests','.']; from pathlib import Path; from fixtures import two_column_pdf; two_column_pdf(Path('../e2e.pdf'))"
      - name: Run browser smoke test
        run: cd frontend && E2E_SCREENSHOTS=../e2e-shots npm run e2e -- ../e2e.pdf
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            api.log
            worker.log
            web.log
            e2e-shots/
