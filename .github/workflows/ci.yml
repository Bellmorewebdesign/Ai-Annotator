name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install OCR and document conversion tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr libreoffice-writer-nogui
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check annotator tests
      - name: Tests
        run: python -m pytest -q -rs

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Fresh Linux install, start and browser test (scripted AI)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: One-command install (the same script users run)
        run: ./install.sh --yes
      - name: Start the app in production mode (the same script users run)
        env:
          ANNOTATOR_ENV: test
          ANNOTATOR_AI_PROVIDER: fake
        run: |
          nohup ./start.sh --prod > app.log 2>&1 &
          for i in $(seq 1 180); do
            curl -sf localhost:8000/api/health > /dev/null && curl -sf localhost:3000 > /dev/null && break
            sleep 1
          done
          curl -sf localhost:8000/api/health
      - name: Create a test document
        run: |
          cd backend
          .venv/bin/python -c "import sys; sys.path[:0]=['tests','.']; from pathlib import Path; from fixtures import two_column_pdf; two_column_pdf(Path('../e2e.pdf'))"
      - name: Run browser smoke test
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          E2E_SCREENSHOTS=../e2e-shots npm run e2e -- ../e2e.pdf
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            app.log
            e2e-shots/
