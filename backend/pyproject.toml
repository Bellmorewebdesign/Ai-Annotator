[project]
name = "ai-annotator-backend"
version = "0.1.0"
description = "AI Annotator backend: API, worker and PDF annotation engine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ocr: requires the Tesseract OCR binary",
    "libreoffice: requires LibreOffice for DOCX conversion",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
